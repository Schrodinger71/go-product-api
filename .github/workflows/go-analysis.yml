name: Go Code Analysis

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ '**' ]

  workflow_dispatch:


jobs:
  analyze:
    name: Analyze Go Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.2'
        cache: true

    - name: Verify dependencies
      run: |
        go mod verify
        go mod tidy
        if git diff --exit-code go.mod go.sum; then
          echo "✅ Dependencies are clean"
        else
          echo "❌ Dependencies have changes. Run 'go mod tidy' and commit changes."
          exit 1
        fi

    - name: Check code format
      run: |
        echo "🔍 Checking code formatting..."
        if [ -n "$(gofmt -l .)" ]; then
          echo "❌ Code is not properly formatted. Run 'gofmt -w .'"
          gofmt -l .
          exit 1
        fi
        echo "✅ Code is properly formatted"

    - name: Run go vet
      run: |
        echo "🔍 Running go vet..."
        go vet ./...
        echo "✅ go vet passed"

    - name: Run staticcheck
      run: |
        echo "🔍 Installing staticcheck..."
        go install honnef.co/go/tools/cmd/staticcheck@latest
        echo "🔍 Running staticcheck..."
        staticcheck ./...
        echo "✅ staticcheck passed"

    - name: Check for unused dependencies
      run: |
        echo "🔍 Checking for unused dependencies..."
        go mod tidy
        if [ -n "$(git diff go.mod)" ]; then
          echo "❌ Unused dependencies found. Run 'go mod tidy'"
          exit 1
        fi
        echo "✅ No unused dependencies"

    - name: Build application
      run: |
        echo "🏗️ Building application..."
        go build -v ./cmd/api
        echo "✅ Build successful"

    - name: Run tests (if exist)
      run: |
        echo "🧪 Running tests..."
        go test -v ./... || echo "⚠️ No tests found or tests failed"

    - name: Code complexity check
      run: |
        echo "📊 Checking code complexity..."
        go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
        gocyclo -over 15 .
        echo "✅ Complexity check completed"
